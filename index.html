<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f8fb">
  <title>Daylight — Weather</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f3f7fa;
      --ink: #182b3a;
      --muted: #71808d;
      --line: rgba(32, 58, 78, .09);
      --card: rgba(255, 255, 255, .82);
      --accent: #168eaa;
      --accent-soft: #e8f5f8;
      --shadow: 0 20px 60px rgba(32, 58, 78, .08);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #101a23;
        --ink: #edf5f8;
        --muted: #9aabb8;
        --line: rgba(228, 241, 248, .1);
        --card: rgba(26, 41, 53, .9);
        --accent: #62c8dc;
        --accent-soft: #203b47;
        --shadow: 0 20px 60px rgba(0, 0, 0, .2);
      }
    }

    * { box-sizing: border-box; }
    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      padding: 44px 18px 32px;
      background:
        radial-gradient(ellipse at 50% -10%, rgba(169, 222, 233, .34), transparent 45%),
        var(--page);
      color: var(--ink);
      font: 15px/1.5 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      transition: background-color .2s, color .2s;
    }
    main { width: min(100%, 460px); margin: 0 auto; }
    .topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 0 2px 22px;
    }
    .brand { display: flex; align-items: center; gap: 9px; font-size: 14px; font-weight: 750; letter-spacing: .02em; }
    .brand-mark {
      display: grid;
      width: 30px;
      height: 30px;
      place-items: center;
      border-radius: 10px;
      background: linear-gradient(145deg, #f9c76a, #ed9857);
      color: #fff;
      font-size: 17px;
      box-shadow: 0 5px 15px rgba(237, 152, 87, .23);
    }
    .live-state { display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: 12px; }
    .live-dot { width: 7px; height: 7px; border-radius: 50%; background: #4cb68a; }

    .search {
      display: flex;
      align-items: center;
      gap: 10px;
      height: 49px;
      padding: 0 15px;
      border: 1px solid var(--line);
      border-radius: 15px;
      background: var(--card);
      box-shadow: 0 5px 20px rgba(32, 58, 78, .035);
    }
    .search svg { flex: 0 0 auto; color: var(--muted); }
    .search input {
      width: 100%;
      min-width: 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--ink);
      font: inherit;
    }
    .search input::placeholder { color: var(--muted); opacity: .82; }
    .search button {
      border: 0;
      padding: 6px 0 6px 8px;
      background: transparent;
      color: var(--accent);
      font: inherit;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }
    .search button:focus-visible, .search input:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    .search-error { min-height: 21px; padding: 4px 4px 0; color: #d76f59; font-size: 12px; }

    .hero {
      position: relative;
      overflow: hidden;
      min-height: 260px;
      margin: 0 0 15px;
      padding: 24px 25px 22px;
      border: 1px solid rgba(255,255,255,.28);
      border-radius: 24px;
      background:
        linear-gradient(90deg, rgba(14, 31, 40, .72), rgba(14, 31, 40, .43) 52%, rgba(14, 31, 40, .12)),
        url("https://thumb.wikimedia.org/wikipedia/commons/thumb/d/d3/Old_City_Walls_and_Tower_of_David_in_Jerusalem_%282019%29_01.jpg/1920px-Old_City_Walls_and_Tower_of_David_in_Jerusalem_%282019%29_01.jpg");
      background-position: center, center 48%;
      background-size: cover;
      color: #fff;
      box-shadow: var(--shadow);
    }
    @media (prefers-color-scheme: dark) {
      .hero {
        border-color: rgba(255,255,255,.06);
      }
    }
    .place { position: relative; z-index: 1; color: inherit; font-size: 14px; font-weight: 650; }
    .date { position: relative; z-index: 1; margin-top: 2px; color: inherit; opacity: .7; font-size: 12px; }
    .current {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 24px;
    }
    .temperature { font-size: clamp(68px, 18vw, 86px); font-weight: 300; letter-spacing: -.09em; line-height: .94; }
    .unit { position: relative; top: -27px; margin-left: 6px; font-size: 24px; font-weight: 350; letter-spacing: -.04em; }
    .condition { margin-top: 9px; font-size: 15px; font-weight: 650; }
    .high-low { margin-top: 3px; font-size: 12px; opacity: .72; }
    .weather-icon { margin: -8px 13px 0 0; font-size: 76px; filter: drop-shadow(0 9px 10px rgba(92, 115, 121, .16)); }
    .details {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      margin: 0 0 25px;
      padding: 15px 5px;
      border: 1px solid var(--line);
      border-radius: 17px;
      background: var(--card);
    }
    .detail { padding: 0 12px; }
    .detail + .detail { border-left: 1px solid var(--line); }
    .detail-label { color: var(--muted); font-size: 11px; }
    .detail-value { margin-top: 3px; font-size: 14px; font-weight: 700; }

    .section-heading { display: flex; align-items: center; justify-content: space-between; margin: 0 2px 11px; }
    h2 { margin: 0; font-size: 15px; font-weight: 720; letter-spacing: -.01em; }
    .section-note { color: var(--muted); font-size: 11px; }
    .forecast { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
    .day {
      min-height: 130px;
      padding: 12px 5px 10px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--card);
      text-align: center;
      box-shadow: 0 5px 16px rgba(32,58,78,.025);
    }
    .day-name { color: var(--muted); font-size: 11px; font-weight: 600; }
    .day-icon { margin: 10px 0 9px; font-size: 23px; line-height: 1; }
    .day-temps { display: flex; justify-content: center; gap: 6px; font-size: 12px; font-weight: 700; }
    .day-low { color: var(--muted); font-weight: 500; }
    .rain { margin-top: 4px; color: var(--accent); font-size: 10px; }
    footer { margin-top: 26px; color: var(--muted); font-size: 11px; text-align: center; }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; }

    @media (max-width: 380px) {
      body { padding: 28px 13px; }
      .hero { padding: 21px 20px; }
      .day { padding-right: 2px; padding-left: 2px; }
      .weather-icon { margin-right: 4px; font-size: 66px; }
    }
  </style>
</head>
<body>
  <main>
    <header class="topline">
      <div class="brand"><span class="brand-mark" aria-hidden="true">☀</span> daylight</div>
      <div class="live-state"><span class="live-dot" id="status-dot"></span><span id="status-text">Live weather</span></div>
    </header>

    <form class="search" id="search-form" role="search">
      <label class="sr-only" for="city-input">Search for a city</label>
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="10.8" cy="10.8" r="6.8" stroke="currentColor" stroke-width="1.8"/><path d="m16 16 4.2 4.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <input id="city-input" type="search" placeholder="Search a city…" autocomplete="off">
      <button type="submit">Search</button>
    </form>
    <div class="search-error" id="search-error" aria-live="polite"></div>

    <section class="hero" aria-label="Current weather">
      <div class="place" id="place">Jerusalem, Israel</div>
      <div class="date" id="today-date"></div>
      <div class="current">
        <div>
          <div class="temperature"><span id="temperature">18</span><span class="unit">°</span></div>
          <div class="condition" id="condition">Partly cloudy</div>
          <div class="high-low" id="high-low">H: 21° &nbsp; L: 15°</div>
        </div>
        <div class="weather-icon" id="weather-icon" aria-hidden="true">⛅</div>
      </div>
    </section>

    <section class="details" aria-label="Weather details">
      <div class="detail"><div class="detail-label">Feels like</div><div class="detail-value" id="feels-like">17°</div></div>
      <div class="detail"><div class="detail-label">Humidity</div><div class="detail-value" id="humidity">62%</div></div>
      <div class="detail"><div class="detail-label">Wind</div><div class="detail-value" id="wind">12 km/h</div></div>
    </section>

    <section aria-labelledby="forecast-title">
      <div class="section-heading">
        <h2 id="forecast-title">5-day forecast</h2>
        <span class="section-note">Next few days</span>
      </div>
      <div class="forecast" id="forecast" aria-live="polite"></div>
    </section>
    <footer>Weather data by Open-Meteo · Photo: <a href="https://commons.wikimedia.org/wiki/File:Old_City_Walls_and_Tower_of_David_in_Jerusalem_(2019)_01.jpg" target="_blank" rel="noopener noreferrer">Pudelek / Wikimedia Commons (CC BY-SA 4.0)</a></footer>
  </main>

  <script>
    const fallbackDates = Array.from({ length: 5 }, (_, offset) => {
      const date = new Date();
      date.setDate(date.getDate() + offset);
      return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}-${String(date.getDate()).padStart(2, "0")}`;
    });
    const fallback = {
      current: { temperature_2m: 18, apparent_temperature: 17, relative_humidity_2m: 62, wind_speed_10m: 12, weather_code: 2 },
      daily: {
        time: fallbackDates,
        weather_code: [2, 1, 3, 61, 2],
        temperature_2m_max: [21, 22, 19, 17, 20],
        temperature_2m_min: [15, 16, 14, 13, 15],
        precipitation_probability_max: [10, 5, 20, 70, 10]
      }
    };
    const $ = (id) => document.getElementById(id);
    const weather = (code) => {
      if (code === 0) return ["Clear sky", "☀️"];
      if (code <= 2) return ["Partly cloudy", "⛅"];
      if (code === 3) return ["Overcast", "☁️"];
      if (code <= 48) return ["Foggy", "🌫️"];
      if (code <= 57) return ["Drizzle", "🌦️"];
      if (code <= 67) return ["Rain", "🌧️"];
      if (code <= 77) return ["Snow", "❄️"];
      if (code <= 82) return ["Rain showers", "🌦️"];
      if (code <= 86) return ["Snow showers", "🌨️"];
      return ["Thunderstorm", "⛈️"];
    };
    const dateLabel = (date) => new Intl.DateTimeFormat(undefined, { weekday: "long", month: "long", day: "numeric" }).format(new Date(`${date}T12:00:00`));
    const rounded = (value) => Math.round(value);

    function render(data, name, country) {
      const current = data.current;
      const daily = data.daily;
      const [description, icon] = weather(current.weather_code);
      $("place").textContent = country ? `${name}, ${country}` : name;
      $("today-date").textContent = dateLabel(daily.time[0]);
      $("temperature").textContent = rounded(current.temperature_2m);
      $("condition").textContent = description;
      $("weather-icon").textContent = icon;
      $("high-low").innerHTML = `H: ${rounded(daily.temperature_2m_max[0])}° &nbsp; L: ${rounded(daily.temperature_2m_min[0])}°`;
      $("feels-like").textContent = `${rounded(current.apparent_temperature)}°`;
      $("humidity").textContent = `${current.relative_humidity_2m}%`;
      $("wind").textContent = `${rounded(current.wind_speed_10m)} km/h`;
      $("forecast").innerHTML = daily.time.slice(0, 5).map((date, i) => {
        const [label, dayIcon] = weather(daily.weather_code[i]);
        const day = i === 0 ? "Today" : new Intl.DateTimeFormat(undefined, { weekday: "short" }).format(new Date(`${date}T12:00:00`));
        const rain = daily.precipitation_probability_max?.[i];
        return `<article class="day" aria-label="${day}: ${label}, high ${rounded(daily.temperature_2m_max[i])} degrees, low ${rounded(daily.temperature_2m_min[i])} degrees">
          <div class="day-name">${day}</div><div class="day-icon" aria-hidden="true">${dayIcon}</div>
          <div class="day-temps"><span>${rounded(daily.temperature_2m_max[i])}°</span><span class="day-low">${rounded(daily.temperature_2m_min[i])}°</span></div>
          <div class="rain">${rain == null ? "&nbsp;" : `${rain}% rain`}</div>
        </article>`;
      }).join("");
    }

    async function loadCity(city) {
      $("search-error").textContent = "";
      $("status-text").textContent = "Loading…";
      $("status-dot").style.background = "#e6aa48";
      try {
        const geoResponse = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1&language=en&format=json`);
        if (!geoResponse.ok) throw new Error("City lookup failed");
        const location = (await geoResponse.json()).results?.[0];
        if (!location) {
          $("search-error").textContent = `We couldn't find “${city}”. Try another city.`;
          $("status-text").textContent = "Live weather";
          $("status-dot").style.background = "#4cb68a";
          return;
        }
        const params = new URLSearchParams({
          latitude: location.latitude,
          longitude: location.longitude,
          current: "temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m",
          daily: "weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max",
          timezone: "auto",
          forecast_days: "6"
        });
        const response = await fetch(`https://api.open-meteo.com/v1/forecast?${params}`);
        if (!response.ok) throw new Error("Weather request failed");
        const data = await response.json();
        render(data, location.name, location.country);
        $("status-text").textContent = "Live weather";
        $("status-dot").style.background = "#4cb68a";
      } catch (error) {
        render(fallback, city, "");
        $("status-text").textContent = "Sample forecast";
        $("status-dot").style.background = "#e6aa48";
      }
    }

    $("search-form").addEventListener("submit", (event) => {
      event.preventDefault();
      const city = $("city-input").value.trim();
      if (city) loadCity(city);
    });
    $("today-date").textContent = dateLabel(fallback.daily.time[0]);
    render(fallback, "Jerusalem", "Israel");
    loadCity("Jerusalem");
  </script>
</body>
</html>
